const ITERATIONS=600000;

function fromB64(s){
 const b=atob(s),a=new Uint8Array(b.length);
 for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
 return a;
}

async function unlock(){
 const password=document.getElementById("password").value;
 const error=document.getElementById("error");
 error.textContent="";
 if(!password){error.textContent="Enter the password.";return;}

 try{
  const base=await crypto.subtle.importKey(
   "raw",new TextEncoder().encode(password),
   {name:"PBKDF2"},false,["deriveKey"]
  );
  const key=await crypto.subtle.deriveKey(
   {name:"PBKDF2",salt:fromB64(ENCRYPTED.salt),
    iterations:ENCRYPTED.iterations,hash:"SHA-256"},
   base,{name:"AES-GCM",length:256},false,["decrypt"]
  );
  const plain=await crypto.subtle.decrypt(
   {name:"AES-GCM",iv:fromB64(ENCRYPTED.iv)},
   key,fromB64(ENCRYPTED.ciphertext)
  );
  const html=new TextDecoder().decode(plain);

  /*
   * Put the decrypted original document into a Blob URL and navigate
   * to it. This preserves the original HTML as a complete document.
   */
  const blob=new Blob([html],{type:"text/html"});
  const url=URL.createObjectURL(blob);
  location.replace(url);
 }catch(e){
  error.textContent="Incorrect password or corrupted protected file.";
 }
}

document.getElementById("password").addEventListener("keydown",e=>{
 if(e.key==="Enter")unlock();
});
</script>
